<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main">
        <div class="hero-banner">
            <div class="hero-top"></div>
            <div class="hero-text">
                <img src="images/odin-lined.png" alt="Picture of Odin" class="logo-icon"> 
                Odin
            </div>
            <div class="hero-footer">Photo by&nbsp;<a href="https://unsplash.com/@haliewestphoto">Halie West</a>&nbsp;on&nbsp;<a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unspash.com</a></div>
        </div>
        <div class="main-content">
            <div class="top-level-1">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <form action="">
                <div class="form-fields">
                    <p>Let's do this!</p>
                    <div class="form-row">
                        <div class="field-group">
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" name="first_name" id="first_name" required>
                        </div>
                        <div class="field-group">
                            <label for="last_name">LAST NAME</label>
                            <input type="text" name="last_name" id="last_name" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="field-group">
                            <label for="email">EMAIL</label>
                            <input type="email" name="email" id="email" required>
                        </div>
                        <div class="field-group">
                            <label for="phone_nbr">PHONE NUMBER</label>
                            <input 
                                type="tel" 
                                name="phone_nbr" 
                                id="phone_nbr" 
                                pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                                required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="field-group">
                            <label for="password">PASSWORD</label>
                            <input type="password" name="password" id="password" required>
                        </div>
                        <div class="field-group">
                            <label for="password_conf">CONFIRM PASSWORD</label>
                            <input type="password" name="password_conf" id="password_conf" required>
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button>Create Account</button>
                    <p class="log-in">Already have an account?&nbsp;<a href="#" id="log-in">Log in</a></p>
                </div>

            </form>
        </div>
    </div>
</body>
</html>
